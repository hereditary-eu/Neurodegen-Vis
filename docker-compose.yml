services:
  backend:
    image: neurodegenvis-backend
    build: backend/
    ports:
      - 8000:8000
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SERVER: ${SERVER}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}

  frontend:
    image: neurodegenvis-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - 80:80
